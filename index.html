<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATAST Student Section</title>
<link rel="icon" href="images/atast-logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* ---------- loading screen ---------- */
#loader{position:fixed;inset:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#loader.out{opacity:0;pointer-events:none}
#loader .ld{display:flex;flex-direction:column;align-items:center;gap:14px}
#loader img{height:68px;width:auto}
#loader .ld-line{width:150px;height:2px;background:#f3d6d3;overflow:hidden;border-radius:2px}
#loader .ld-line i{display:block;height:100%;width:42%;background:#D62828;animation:ldslide 1.1s ease-in-out infinite}
@keyframes ldslide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#loader .ld-line i{animation:none;width:100%}}

/* ---------- menu icons + bar ---------- */
.bar{display:flex;align-items:center;gap:16px;flex:1}
nav a{display:inline-flex;align-items:center;gap:7px}
nav a .ic{width:18px;height:18px;flex:none}
#authBox a,#authBox button{display:inline-flex;align-items:center}
#inBtn::before,#outBtn::before,#authBox a::before{content:'';display:inline-block;width:16px;height:16px;margin-right:6px;background:currentColor;
  -webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
#inBtn,#authBox a{--i:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='8' r='4'/><path d='M4 21c0-4 3.6-7 8-7s8 3 8 7'/></svg>")}
#outBtn{--i:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9'/></svg>")}

/* ---------- home sections added on top of the app ---------- */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px;flex-wrap:wrap}
.sec-head h2{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters button{background:#fff;border:1px solid var(--line);color:var(--soft);padding:8px 16px;border-radius:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gal{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.gcard{position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:#EEEEF1;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--faint);font-size:14px}
.gcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcard .tag{position:absolute;left:8px;top:8px;background:#8E91A3;color:#fff;font-size:12px;font-weight:700;padding:3px 10px}
.gcard.has .tag{background:#000}
.gcard svg{width:26px;height:26px}
.gcard[hidden]{display:none}

/* ---------- board (centred, two columns) + Events heading in the same style as the other sections ---------- */
.board-wrap{max-width:none;margin:0;padding-bottom:24px}
.board-wrap h2{margin-bottom:22px}   /* gap between the board title and the cards */                       /* title stays on the left */
.board-wrap .grid{grid-template-columns:repeat(2,1fr);gap:14px 80px;max-width:720px;margin:0 auto}  /* cards centred, wider gap between the two columns */
/* stats strip */
.stats{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:12px;margin:14px 0 0;overflow:hidden}
.stats>div{padding:18px 22px}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.stats span{display:block;margin-top:6px;font-size:13px;color:var(--faint)}
.board-wrap .card{border-radius:14px;padding:14px 18px;border-left-width:4px}
.ev-sec .eyebrow{display:none}
.ev-sec h2{margin:24px 0 10px;font-size:19px}
.ev-sec .sub{margin:0 0 4px;max-width:none}

/* ---------- phone: floating icon bar at the bottom, sign-in stays in the top bar ---------- */
@media(max-width:700px){
  .top-inner{padding:8px 16px;flex-wrap:nowrap}
  #authBox{margin-left:auto;gap:6px}
  #inBtn,#outBtn,#authBox a{font-size:0;padding:0;width:44px;height:40px;justify-content:center;border-radius:10px}
  #authBox a{color:var(--accent);background:var(--accent-soft)}
  #inBtn::before,#outBtn::before,#authBox a::before{width:23px;height:23px;margin:0}
  .bar{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;flex:none;
       background:#fff;border-radius:999px;padding:6px;box-shadow:0 6px 26px rgba(20,20,50,.22),0 0 0 1px rgba(20,20,50,.05)}
  nav{flex:1;justify-content:space-between;gap:4px}
  nav a{flex:1;justify-content:center;padding:11px 0;border-radius:999px;color:#1c1e21}
  nav a .ic{width:25px;height:25px}
  nav a .lb{display:none}
  nav a.on{background:var(--accent-soft);color:var(--accent)}
  nav a[data-route=calendar]{order:1} nav a[data-route=home]{order:2} nav a[data-route=clubs]{order:3}
  main{padding-bottom:110px}
  .foot{margin-bottom:70px}
  .gal{grid-template-columns:1fr}
  .toast{bottom:96px}
}
@media(max-width:560px){ .board-wrap .grid{grid-template-columns:1fr} .stats>div{padding:14px 16px} .stats b{font-size:26px} }

/* ---------- long text stays inside its box ---------- */
.modal,.summary,.ev,.ev>div,.card,.row>div,.sub{overflow-wrap:anywhere;word-break:break-word}
.ev>div{min-width:0}
.summary{white-space:pre-wrap}
/* ---------- show / hide password ---------- */
.pw{position:relative}
.pw input{padding-right:46px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--soft);line-height:0;padding:7px 8px;border-radius:8px}
.pw .eye svg{display:block}
.pw .eye:hover{background:var(--accent-soft)}
</style>
</head>
<body>

<div id="loader" role="status" aria-label="Loading">
  <div class="ld"><img src="images/atast-logo.png" alt="ATAST"><div class="ld-line"><i></i></div></div>
</div>

<header class="top">
  <div class="top-inner">
    <a href="#home" class="brand"><img src="images/atast-logo.png" alt="ATAST"><span>Student Section</span></a>
    <div class="bar">
      <nav id="nav" aria-label="Main">
        <a href="#home" data-route="home" aria-label="Home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lb">Home</span></a>
        <a href="#calendar" data-route="calendar" aria-label="Calendar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="lb">Calendar</span></a>
        <a href="#clubs" data-route="clubs" aria-label="Clubs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg><span class="lb">Clubs</span></a>
      </nav>
    </div>
    <div id="authBox"></div>
  </div>
</header>

<main id="view" aria-live="polite"></main>
<footer class="foot">ATAST Student Section _ Different Clubs, One Community</footer>

<div id="modalRoot"></div>

<!-- loading screen: hide once the page has loaded (never stays longer than 5 s) -->
<script>
(function(){
  var l=document.getElementById('loader'),t0=Date.now(),done=false;
  function hide(){
    if(done||!l) return; done=true;
    setTimeout(function(){ l.classList.add('out'); setTimeout(function(){ l.remove(); },400); }, Math.max(0,700-(Date.now()-t0)));
  }
  window.addEventListener('load',hide); setTimeout(hide,5000);
})();
</script>

<script type="module" src="js/app.js"></script>

<!-- Extra page sections, added on top of the rendered views (js/app.js is not modified) -->
<script type="module">
import { CLUBS } from './js/config.js';
import { getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const view = document.getElementById('view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Student Section "Events" programs: Academy / SSS / BTech.
   Add photos by saving them as images/academy.jpg, images/sss.jpg, images/btech.jpg. */
const PROGRAMS = [
  { id: 'academy', label: 'Academy', photo: 'images/student-board.jpg' },
  { id: 'sss',     label: 'SSS',     photo: 'images/sss.jpg' },
  { id: 'btech',   label: 'BTech',   photo: 'images/btech.jpg' },
];
const PH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>';

function galleryHtml() {
  return `<section class="ev-sec" data-enh="gallery">
    <p class="eyebrow">ATAST Student Section</p>
    <h2>Events</h2>
    <p class="sub">The Student Section runs three programs each year: Academy, SSS and B-Tech.</p>
    <div class="filters" role="group" aria-label="Filter programs">
      <button type="button" class="on" data-f="all">All</button>
      ${PROGRAMS.map(p => `<button type="button" data-f="${p.id}">${esc(p.label)}</button>`).join('')}
    </div>
    <div class="gal">${PROGRAMS.map(p => `<div class="gcard" data-cat="${p.id}"><span class="tag">${esc(p.label)}</span>${PH_ICON}<span class="ph">Photo coming soon</span></div>`).join('')}</div>
  </section>`;
}
function wireGallery(sec) {
  sec.querySelectorAll('.gcard').forEach(card => {
    const p = PROGRAMS.find(x => x.id === card.dataset.cat);
    const img = new Image(); img.alt = p.label + ' photo';
    img.onload = () => { card.classList.add('has'); card.querySelectorAll('svg,.ph').forEach(n => n.remove()); card.prepend(img); };
    img.src = p.photo;
  });
  sec.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
    sec.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === b));
    sec.querySelectorAll('.gcard').forEach(c => { c.hidden = b.dataset.f !== 'all' && c.dataset.cat !== b.dataset.f; });
  }));
}

/* number of dates set on the calendar, kept live for the stats strip */
let datesSet = 0;
function paintStats() { const el = document.getElementById('stDates'); if (el) el.textContent = datesSet; }
try {
  onValue(ref(getDatabase(getApp()), 'event'), snap => {
    const raw = snap.val() || {};
    datesSet = Object.keys(raw).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && raw[k] && CLUBS.some(c => c.id === raw[k].clubId)).length;
    paintStats();
  }, () => {});
} catch (e) { console.error(e); }

function enhanceHome() {
  if (view.querySelector('[data-enh]')) return;
  const h2s = [...view.querySelectorAll('h2')];
  const up = h2s.find(h => h.textContent.trim() === 'Upcoming events');
  if (!up) return;
  // "Open full calendar" goes to the top right of the upcoming events title
  const hero = view.querySelector('.hero');
  if (hero) {
    const st = document.createElement('div'); st.className = 'stats'; st.dataset.enh = 'stats';
    st.innerHTML = `<div><b>${CLUBS.length}</b><span>Clubs on the platform</span></div><div><b id="stDates">${datesSet}</b><span>Program dates set</span></div>`;
    hero.after(st);
  }
  const head = document.createElement('div'); head.className = 'sec-head'; head.dataset.enh = 'head';
  up.replaceWith(head); head.appendChild(up);
  const link = [...view.querySelectorAll('a[href="#calendar"]')].find(a => /full calendar/i.test(a.textContent));
  if (link) {
    const p = link.parentElement;
    link.className = 'btn ghost small'; link.style.textDecoration = 'none'; link.textContent = 'Open full calendar';
    head.appendChild(link);
    if (p && p.tagName === 'P' && !p.textContent.trim()) p.remove();
  }
  // Events (Academy / SSS / BTech) section, before the student board
  const board = [...view.querySelectorAll('h2')].find(h => /Student Section board/i.test(h.textContent));
  const wrap = document.createElement('div'); wrap.innerHTML = galleryHtml();
  const sec = wrap.firstElementChild;
  if (board) board.before(sec); else view.appendChild(sec);
  wireGallery(sec);
  // Student Section board: centred column, two cards per row
  const bh = [...view.querySelectorAll('h2')].find(x => /Student Section board/i.test(x.textContent));
  const grid = bh && bh.nextElementSibling;
  if (grid && grid.classList.contains('grid')) {
    const w = document.createElement('div'); w.className = 'board-wrap'; w.dataset.enh = 'board';
    bh.before(w); w.append(bh, grid);
  }
}

function enhanceClub() {
  const m = location.hash.match(/^#club\/(\w+)/); if (!m) return;
  const card = view.querySelector('.cols .card');
  if (!card || card.dataset.enh) return;
  card.dataset.enh = 'board';
  const club = CLUBS.find(c => c.id === m[1]);
  if (!club || !club.managerName) return;
  const header = card.firstElementChild;                       // the "Board" title row
  const same = [...card.querySelectorAll('.row')].slice(1)
    .find(r => (r.querySelector('b') || {}).textContent?.trim().toLowerCase() === club.managerName.trim().toLowerCase());
  const empty = card.querySelector('.empty'); if (empty) empty.remove();
  if (same) { header.after(same); return; }                     // manager already listed: move to the top
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div><b>${esc(club.managerName)}</b><div class="r">Event Manager</div></div>`;
  header.after(row);
}

function enhance() { enhanceHome(); enhanceClub(); }
new MutationObserver(enhance).observe(view, { childList: true });
enhance();


/* Show / hide password: barred eye = hidden, open eye = shown. Added to every password field that appears in a window. */
const EYE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5.5 19 1.5 12 1.5 12a18.5 18.5 0 0 1 4.6-5.4M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10.5 7 10.5 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
const modalRoot = document.getElementById('modalRoot');
function addEyes() {
  modalRoot.querySelectorAll('input[type=password]').forEach(input => {
    if (input.parentElement.classList.contains('pw')) return;
    const wrap = document.createElement('div'); wrap.className = 'pw';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'eye'; btn.innerHTML = EYE_OFF; btn.title = 'Show password'; btn.setAttribute('aria-label', 'Show password');
    const hadFocus = document.activeElement === input;
    input.before(wrap); wrap.append(input, btn);
    if (hadFocus) input.focus();
    btn.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE : EYE_OFF;
      const t = show ? 'Hide password' : 'Show password';
      btn.title = t; btn.setAttribute('aria-label', t);
      input.focus();
    });
  });
}
new MutationObserver(addEyes).observe(modalRoot, { childList: true, subtree: true });
addEyes();

/* Icon-only buttons on phones need names for screen readers */
const authBox = document.getElementById('authBox');
function label() {
  const set = (el, t) => { if (el && !el.getAttribute('aria-label')) { el.setAttribute('aria-label', t); el.title = t; } };
  set(document.getElementById('inBtn'), 'Event manager sign in');
  set(document.getElementById('outBtn'), 'Sign out');
  set(authBox.querySelector('a'), 'My club');
}
new MutationObserver(label).observe(authBox, { childList: true }); label();
</script>
</body>
</html>
